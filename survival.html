<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#182322"><title>星域幸存者 · 星域棋战</title>
  <link rel="stylesheet" href="survival/style.css?v=3">
</head>
<body>
  <main id="stage" aria-label="星域幸存者战场"></main>
  <div id="hurt-screen" aria-hidden="true"></div>
  <header class="topbar">
    <a href="index.html" class="icon-btn" aria-label="返回星域棋战" title="返回星域棋战"><span data-icon="arrow-left"></span></a>
    <div class="brand"><h1>星域幸存者</h1><span id="hero-name">星域棋战</span></div>
    <div class="wave-chip"><span id="wave">第 1 / 20 波</span><strong id="timer">准备</strong></div>
    <div class="toolbar">
      <button id="sound" class="icon-btn" title="切换音效" aria-label="关闭音效"><span data-icon="volume-2"></span></button>
      <button id="pause" class="icon-btn" title="暂停" aria-label="暂停"><span data-icon="pause"></span></button>
    </div>
  </header>
  <section class="hud" aria-label="角色状态">
    <div class="meter health"><span data-icon="heart"></span><div><div class="meter-label"><b>生命</b><span id="hp-label">35 / 35</span></div><progress id="hp" max="35" value="35"></progress></div></div>
    <div class="meter experience"><span data-icon="sparkles"></span><div><div class="meter-label"><b id="level">等级 1</b><span id="xp-label">0 / 11</span></div><progress id="xp" max="11" value="0"></progress></div></div>
    <div class="currency"><span data-icon="gem"></span><strong id="coins">0</strong><span>材料</span></div>
  </section>
  <div class="combat-readout"><span data-icon="crosshair"></span>击败 <b id="kills">0</b></div>
  <aside id="signature-hud" class="signature-hud" aria-label="专属技能"><div><b id="signature-name">专属技能</b><span id="signature-state">就绪</span></div><progress id="signature-ready" max="1" value="1"></progress><small id="signature-shield"></small></aside>
  <footer class="loadout"><div id="weapons" class="weapon-slots" aria-label="武器"></div><div id="companions" class="companion-slots" aria-label="伙伴"></div></footer>
  <div id="joystick" role="group" aria-label="移动摇杆"><div id="stick"></div></div>
  <div id="notice" role="status" aria-live="polite"></div>
  <dialog id="panel" aria-labelledby="panel-title"><div id="panel-content"><h2 id="panel-title">正在载入战场</h2><progress></progress></div></dialog>
  <script src="survival/vendor/phaser-3.90.0.min.js"></script>
  <script src="survival/vendor/lucide.min.js"></script>
  <script src="tools/battle-audio.js?v=1"></script>
  <script src="survival/classic-kits.js?v=1"></script>
  <script src="survival/content.js?v=1"></script>
  <script src="survival/core.js?v=2"></script>
  <script src="survival/actors.js?v=1"></script>
  <script src="survival/feedback.js?v=1"></script>
  <script src="survival/skills.js?v=1"></script>
  <script src="survival/game.js?v=5"></script>
</body>
</html>
