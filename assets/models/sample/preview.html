<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>岁己 · 3D 棋盘样板</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#17111f;color:#f8edf2;font-family:system-ui,"Microsoft YaHei",sans-serif}
canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}canvas:active{cursor:grabbing}
.panel{position:absolute;left:20px;top:18px;max-width:320px;padding:16px 19px;border:1px solid #ffffff3a;border-radius:16px;background:#241b31de;box-shadow:0 14px 40px #0008;backdrop-filter:blur(8px)}
h1{font-size:20px;margin:0 0 5px}.sub{font-size:12px;color:#dbc9db;line-height:1.6;margin:0}.tag{color:#9ce6c0}
.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}button{border:1px solid #dcabc2;border-radius:9px;background:#693c5f;color:white;padding:7px 10px;cursor:pointer}button.on{background:#ad496b}
.hint{position:absolute;right:15px;bottom:14px;font-size:12px;color:#e5cde2;background:#241b31b8;padding:8px 12px;border-radius:10px}
.error{position:absolute;left:20px;bottom:20px;color:#ffb1ad}
@media(max-width:600px){.panel{left:10px;top:10px;right:10px;max-width:none;padding:11px 13px}h1{font-size:16px}.hint{font-size:10px;bottom:8px;right:8px}}
</style>
</head>
<body>
<canvas id="scene" aria-label="可旋转的岁己与棋盘 3D 样板"></canvas>
<div class="panel"><h1>岁己 · 3D 舞台样板</h1><p class="sub"><span class="tag">8×8 抬高棋盘</span> · 银白双马尾 · 红帽与蔷薇 · 黑红裙装<br>拖动旋转，滚轮缩放；下方按钮切换单独查看。</p><div class="actions"><button data-mode="both" class="on">棋盘＋岁己</button><button data-mode="board">只看棋盘</button><button data-mode="suiji">只看岁己</button><button id="turn">自动旋转</button></div></div>
<div class="hint">模型文件：stage_board.glb · suiji_chibi.glb</div><div id="error" class="error"></div>
<script>
const canvas=document.querySelector('#scene'),ctx=canvas.getContext('2d',{alpha:false});
let data=null,mode='both',yaw=-.28,pitch=.87,distance=15.5,spin=false,drag=false,lastX=0,lastY=0;
const hex=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)};
function draw(){
  if(!data)return;
  const w=canvas.width=innerWidth*devicePixelRatio,h=canvas.height=innerHeight*devicePixelRatio;
  const gradient=ctx.createLinearGradient(0,0,0,h);gradient.addColorStop(0,'#30243a');gradient.addColorStop(1,'#0e1020');ctx.fillStyle=gradient;ctx.fillRect(0,0,w,h);
  const target=mode==='suiji'?[-1.5,.9,1.5]:[0,.3,0];
  const cam=[target[0]+Math.sin(yaw)*Math.sin(pitch)*distance,target[1]+Math.cos(pitch)*distance,target[2]-Math.cos(yaw)*Math.sin(pitch)*distance];
  const forward=norm(target.map((v,i)=>v-cam[i])),right=norm(cross([0,1,0],forward)),up=norm(cross(forward,right));
  const focal=Math.min(w/9.7,h/8.5)*15.5*.86;
  const project=p=>{const d=p.map((v,i)=>v-cam[i]),depth=dot(d,forward);return [w/2+dot(d,right)*focal/depth,h*.54-dot(d,up)*focal/depth,depth]};
  const triangles=[];
  const sources=mode==='both'?['board','suiji']:[mode];
  for(const source of sources)for(const [material,meshes] of Object.entries(data[source])){
    const base=hex(data.materials[material]);
    for(const [verts,faces] of meshes){
      const projected=verts.map(project);
      for(const [ia,ib,ic] of faces){
        const a=projected[ia],b=projected[ib],c=projected[ic];
        if(a[2]<=.05||b[2]<=.05||c[2]<=.05)continue;
        const va=verts[ia],vb=verts[ib],vc=verts[ic];
        const n=norm(cross(vb.map((v,i)=>v-va[i]),vc.map((v,i)=>v-va[i])));
        const light=Math.max(.45,Math.min(1.2,.82+.34*dot(n,norm([-.5,1,-.7]))));
        triangles.push({a,b,c,depth:(a[2]+b[2]+c[2])/3,color:`rgb(${base.map(v=>Math.min(255,Math.round(v*light))).join(',')})`});
      }
    }
  }
  triangles.sort((a,b)=>b.depth-a.depth);
  for(const t of triangles){ctx.fillStyle=t.color;ctx.beginPath();ctx.moveTo(t.a[0],t.a[1]);ctx.lineTo(t.b[0],t.b[1]);ctx.lineTo(t.c[0],t.c[1]);ctx.closePath();ctx.fill()}
}
let frame=0;function loop(){if(spin){yaw+=.004;draw()}frame=requestAnimationFrame(loop)}
canvas.addEventListener('pointerdown',e=>{drag=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(!drag)return;yaw+=(e.clientX-lastX)*.006;pitch=Math.max(.25,Math.min(1.5,pitch+(e.clientY-lastY)*.005));lastX=e.clientX;lastY=e.clientY;draw()});
canvas.addEventListener('pointerup',()=>drag=false);
canvas.addEventListener('wheel',e=>{e.preventDefault();distance=Math.max(4,Math.min(27,distance*Math.exp(e.deltaY*.001)));draw()},{passive:false});
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('on',x===b));distance=mode==='suiji'?6.5:15.5;draw()});
document.querySelector('#turn').onclick=e=>{spin=!spin;e.target.classList.toggle('on',spin)};
addEventListener('resize',draw);
fetch('sample_scene.json').then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(d=>{data=d;draw();loop()}).catch(e=>{document.querySelector('#error').textContent='预览需要本地 HTTP 服务：python -m http.server 8081。'+e.message});
</script>
</body></html>
